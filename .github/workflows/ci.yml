name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.3.0

      - name: Ruff check
        run: ruff check lumena/ tests/

      - name: Ruff format check
        run: ruff format --check lumena/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: MyPy type check
        run: mypy lumena/ --ignore-missing-imports

      # Ignored advisories — kept in lockstep with security.yml (the canonical
      # vuln-scan policy). Revisit when optimum-onnx supports transformers 5.x.
      #
      # transformers 4.57.x — PYSEC-2025-217, PYSEC-2026-2288/2289/2290: all
      #   require loading untrusted checkpoints/configs from the Hub. Lumena
      #   only loads models pinned to immutable commit SHAs (lumena/cli/models.py
      #   KNOWN_MODELS) or local dirs it exported itself, behind a sovereign-mode
      #   network block by default. Upgrading to fixed 5.x is blocked:
      #   optimum-onnx (0.1.0) requires transformers<4.58.
      # diskcache 5.6.3 — PYSEC-2026-2447: pickle deserialization; no fixed
      #   release exists. Transitive via langchain; Lumena never imports it.
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --desc \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-2447

  guardrails:
    name: Code Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Deterministic, offline guardrail gate over the Python changed in this PR
      # (AST dangerous-calls, hardcoded secrets, SQL string-formatting, unsafe
      # yaml/pickle, bare excepts, plus the No-Vaporware / No-False-Claims rules:
      # placeholder stub bodies and TODO/FIXME/false-availability markers — see
      # AGENTS.md). Fails on HIGH/BLOCKER. This is the enforced baseline for all
      # generated code; the pydantic-ai reviewer is an optional semantic layer.
      - name: Guardrail scan of changed Python
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- '*.py' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files to scan."
            exit 0
          fi
          echo "Scanning changed Python files:"
          echo "$CHANGED"
          echo "$CHANGED" | python -m lumena.dev --stdin

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      - name: Test with coverage
        run: pytest -q --tb=short --cov=lumena --cov-report=term-missing --cov-report=json --cov-report=xml --cov-fail-under=50

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.json
          retention-days: 7

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7
