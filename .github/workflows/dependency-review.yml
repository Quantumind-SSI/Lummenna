name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # actions/dependency-review-action requires GitHub's PR-time "Dependency
      # review" API. On PRIVATE repositories that capability is gated behind
      # GitHub Advanced Security, which is not provisioned for this repo/plan —
      # the action hard-errors with "Dependency review is not supported on this
      # repository". The Dependency Graph itself IS enabled (Dependabot alerts +
      # the SBOM endpoint work), and PR dependency-vulnerability coverage is
      # already provided by the separate "Dependency Vulnerability Scan" job
      # (pip-audit) in ci.yml. So this job runs the review when available but
      # must not block the PR when the API is unavailable on this tier.
      # `continue-on-error` keeps the check green; re-tighten to a hard gate if
      # GitHub Advanced Security is later enabled for this repository.
      - name: Dependency Review
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate
          warn-only: true
          # The action forbids specifying both allow- and deny-licenses. The
          # allow-list is the stricter, self-sufficient policy: any license not
          # in it (including GPL-2.0/GPL-3.0) is already rejected, so a separate
          # deny-licenses is redundant and previously caused a hard config error.
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, PSF-2.0
