name: Deploy to AKS

# Progressive delivery to AKS via OIDC federation (no stored cloud secrets).
#
#   * Tag push v*.*.*        -> auto-deploy to STAGING (namespace: lumena-staging)
#   * Manual workflow_dispatch -> deploy the chosen tag to staging OR production
#
# Production deploys run in the GitHub `production` Environment, which should be
# configured with a required reviewer so promotion is a human decision. Staging
# runs in the `staging` Environment (no gate). Deployments are pinned to an
# explicit image tag — never a moving "latest".
#
# Required repository configuration (see infra/azure/README.md):
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME, ACR_LOGIN_SERVER

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. 1.0.0 or sha-<short>)"
        required: true
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

jobs:
  # Resolve the deploy target once, so both push (auto-staging) and dispatch
  # (chosen env) paths feed a single deploy job with a consistent contract.
  plan:
    name: Resolve Target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve environment, namespace and tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ENV=staging
            TAG="${GITHUB_REF_NAME#v}"
          else
            ENV="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          case "$ENV" in
            staging)    NS=lumena-staging ;;
            production) NS=lumena ;;
            *) echo "unknown environment: $ENV" >&2; exit 1 ;;
          esac
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "namespace=$NS" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag '$TAG' to '$ENV' (namespace '$NS')" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Helm Upgrade (${{ needs.plan.outputs.environment }})
    runs-on: ubuntu-latest
    needs: plan
    # The Environment gate lives here: `production` should require a reviewer.
    environment: ${{ needs.plan.outputs.environment }}
    concurrency:
      # Serialize deploys per namespace; never cancel an in-flight rollout.
      group: deploy-aks-${{ needs.plan.outputs.namespace }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Helm lint
        run: helm lint charts/lumena

      # On a tag push, this workflow and docker-publish start together. Wait for
      # the image to actually exist in ACR before rolling out, so an auto-deploy
      # can't race ahead of its image and fail on ImagePullBackOff.
      - name: Wait for image in ACR
        run: |
          ACR="${{ vars.ACR_LOGIN_SERVER }}"
          REGISTRY="${ACR%%.*}"
          TAG="${{ needs.plan.outputs.image_tag }}"
          for i in $(seq 1 30); do
            if az acr repository show-tags \
                 --name "$REGISTRY" --repository lumena \
                 --query "[?@=='$TAG'] | [0]" -o tsv 2>/dev/null | grep -q "$TAG"; then
              echo "image lumena:$TAG present in $REGISTRY"
              exit 0
            fi
            echo "waiting for lumena:$TAG in $REGISTRY ($i/30)…"
            sleep 20
          done
          echo "image lumena:$TAG never appeared in $REGISTRY after 10m" >&2
          exit 1

      - name: Helm upgrade --install
        run: |
          helm upgrade --install lumena charts/lumena \
            --namespace "${{ needs.plan.outputs.namespace }}" --create-namespace \
            --set image.repository="${{ vars.ACR_LOGIN_SERVER }}/lumena" \
            --set image.tag="${{ needs.plan.outputs.image_tag }}" \
            --set auth.existingSecret=lumena-auth \
            --wait --timeout 5m

      - name: Verify rollout and readiness
        run: |
          NS="${{ needs.plan.outputs.namespace }}"
          kubectl -n "$NS" rollout status statefulset/lumena-lumena --timeout=300s
          kubectl -n "$NS" get pods -o wide
          # Readiness gate is model-aware: a Ready pod means the embedding
          # model is provisioned and the palace is serving real results.
          kubectl -n "$NS" wait --for=condition=Ready pod \
            -l app.kubernetes.io/instance=lumena --timeout=300s
