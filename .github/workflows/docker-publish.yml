name: Docker Publish

# Publishes the runtime image to two registries:
#   * GHCR  — public distribution (docker pull ghcr.io/quantumindssi/lummenna)
#   * ACR   — private pull source for AKS (deploy-aks.yml pulls from here)
#
# Both push identical semver + sha tags so a given release is bit-for-bit the
# same artifact in both registries. ACR uses `az acr build` (server-side build)
# via OIDC federation, so no registry passwords are stored.
#
# Required configuration for the ACR job (see infra/azure/README.md):
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: ACR_LOGIN_SERVER  (e.g. lumenaacr1234.azurecr.io)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # required for Azure OIDC federation (ACR job)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-ghcr:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lummenna
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-test the pushed image: container must come up and answer
      # /health (liveness). /ready is expected 503 without a model — that is
      # the honest contract, so we assert it explicitly.
      - name: Smoke test image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name lummenna-smoke -p 8848:8848 \
            -e LUMENA_ALLOW_MOCK_EMBEDDER=0 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8848/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8848/health
          READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8848/ready)
          if [ "$READY_CODE" != "503" ]; then
            echo "expected /ready=503 without a provisioned model, got $READY_CODE" >&2
            exit 1
          fi
          curl -fsS http://localhost:8848/metrics/prometheus | grep -q lumena_http_requests_total
          docker rm -f lummenna-smoke

  build-push-acr:
    name: Build & Push Image (ACR)
    runs-on: ubuntu-latest
    # Only push to ACR when the Azure federation is configured. Forks and repos
    # without the ACR variable set simply skip this job instead of failing.
    if: vars.ACR_LOGIN_SERVER != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tags
        id: tags
        run: |
          # ACR_LOGIN_SERVER is e.g. lumenaacr1234.azurecr.io; the registry
          # name is the first label. Build the same semver + sha tags GHCR uses.
          ACR="${{ vars.ACR_LOGIN_SERVER }}"
          REGISTRY="${ACR%%.*}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$SHA_TAG"
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      # Server-side build in ACR Tasks: no local docker build, no registry
      # password. The AKS kubelet identity already has AcrPull (see main.bicep).
      - name: ACR build & push
        run: |
          az acr build \
            --registry "${{ steps.tags.outputs.registry }}" \
            --image "lummenna:${{ steps.tags.outputs.version }}" \
            --image "lummenna:${{ steps.tags.outputs.sha_tag }}" \
            --file Dockerfile \
            .
