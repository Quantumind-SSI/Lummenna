name: Docker Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lumena
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-test the pushed image: container must come up and answer
      # /health (liveness). /ready is expected 503 without a model — that is
      # the honest contract, so we assert it explicitly.
      - name: Smoke test image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name lumena-smoke -p 8848:8848 \
            -e LUMENA_ALLOW_MOCK_EMBEDDER=0 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8848/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8848/health
          READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8848/ready)
          if [ "$READY_CODE" != "503" ]; then
            echo "expected /ready=503 without a provisioned model, got $READY_CODE" >&2
            exit 1
          fi
          curl -fsS http://localhost:8848/metrics/prometheus | grep -q lumena_http_requests_total
          docker rm -f lumena-smoke
