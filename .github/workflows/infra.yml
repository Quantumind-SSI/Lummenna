name: Infrastructure

# Provisions the Azure footprint from infra/azure/main.bicep via OIDC
# federation (no stored cloud secrets).
#
#   * Pull request touching infra/azure/**  -> `what-if` preview (read-only,
#     comment-free, non-gating). Lets reviewers see the proposed change.
#   * Manual workflow_dispatch with confirm=APPLY -> `az deployment group
#     create` (actually provisions). Infrastructure changes are a decision,
#     not a side effect of merging.
#
# Required repository configuration (see infra/azure/README.md):
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variables: AZURE_RESOURCE_GROUP, AZURE_LOCATION
# The deployer identity needs Contributor + User Access Administrator on the
# resource group (the template creates an AcrPull role assignment).

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/azure/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to provision (anything else = what-if only)'
        required: true
        default: "what-if"
      name_prefix:
        description: "Resource name prefix (3-12 lowercase alphanumerics)"
        required: true
        default: lumena
      node_vm_size:
        description: "AKS node VM size"
        required: true
        default: Standard_D4s_v5
      node_count:
        description: "AKS system pool node count"
        required: true
        default: "2"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  # Never run two infra operations against the same RG at once.
  group: infra-${{ vars.AZURE_RESOURCE_GROUP }}
  cancel-in-progress: false

jobs:
  what-if:
    name: What-If Preview
    runs-on: ubuntu-latest
    # Runs on every infra PR and on dispatch (as a preview before apply).
    if: vars.AZURE_RESOURCE_GROUP != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep build (lint + compile)
        run: az bicep build --file infra/azure/main.bicep

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --only-show-errors

      - name: What-If
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "lumena-infra-${{ github.run_id }}" \
            --template-file infra/azure/main.bicep \
            --parameters \
              namePrefix="${{ github.event.inputs.name_prefix || 'lumena' }}" \
              nodeVmSize="${{ github.event.inputs.node_vm_size || 'Standard_D4s_v5' }}" \
              nodeCount="${{ github.event.inputs.node_count || '2' }}"

  apply:
    name: Apply (Provision)
    runs-on: ubuntu-latest
    needs: what-if
    # Only on an explicit dispatch that typed APPLY. PRs can never provision.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm == 'APPLY'
    environment: production
    outputs:
      acr_login_server: ${{ steps.outputs.outputs.acr_login_server }}
      aks_cluster_name: ${{ steps.outputs.outputs.aks_cluster_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "lumena-infra-${{ github.run_id }}" \
            --template-file infra/azure/main.bicep \
            --parameters \
              namePrefix="${{ github.event.inputs.name_prefix }}" \
              nodeVmSize="${{ github.event.inputs.node_vm_size }}" \
              nodeCount="${{ github.event.inputs.node_count }}"

      - name: Capture outputs
        id: outputs
        run: |
          DEP="lumena-infra-${{ github.run_id }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ACR=$(az deployment group show -g "$RG" -n "$DEP" --query properties.outputs.acrLoginServer.value -o tsv)
          AKS=$(az deployment group show -g "$RG" -n "$DEP" --query properties.outputs.aksClusterName.value -o tsv)
          echo "acr_login_server=$ACR" >> "$GITHUB_OUTPUT"
          echo "aks_cluster_name=$AKS" >> "$GITHUB_OUTPUT"
          {
            echo "## Provisioned"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| ACR login server | \`$ACR\` |"
            echo "| AKS cluster | \`$AKS\` |"
            echo ""
            echo "> Set repository variable \`ACR_LOGIN_SERVER=$ACR\`, "
            echo "> \`AKS_CLUSTER_NAME=$AKS\`, and \`AKS_RESOURCE_GROUP=$RG\` "
            echo "> so the image and deploy workflows can target this cluster."
          } >> "$GITHUB_STEP_SUMMARY"
