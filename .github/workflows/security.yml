name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      # No base/head: the action auto-detects the scan range per event
      # (pushed commits on push, PR range on pull_request, full-repo scan on
      # schedule). Hardcoding base=main + head=HEAD made them resolve to the
      # same commit on main, which the action treats as a fatal error.
      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      # Ignored advisories (revisit when optimum-onnx supports transformers 5.x):
      #
      # transformers 4.57.x — PYSEC-2025-217, PYSEC-2026-2288, PYSEC-2026-2289,
      #   PYSEC-2026-2290: all require loading untrusted checkpoints/configs
      #   from the Hub. Lumena only loads models pinned to immutable commit
      #   SHAs (see lumena/cli/models.py KNOWN_MODELS) or local directories it
      #   exported itself, behind a sovereign-mode network block by default.
      #   Upgrading to the fixed 5.x line is blocked: optimum-onnx (latest
      #   0.1.0) requires transformers<4.58, and it provides the ONNX export
      #   path Lumena's embedding provisioning depends on.
      #
      # diskcache 5.6.3 — PYSEC-2026-2447: pickle deserialization; no fixed
      #   release exists. Transitive dependency of langchain; Lumena never
      #   imports or writes to diskcache.
      - name: Run pip-audit
        run: |
          python -m pip install pip-audit
          IGNORES="--ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-2447"
          pip-audit --desc --format=json --output=pip-audit.json $IGNORES || true
          pip-audit --desc $IGNORES

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 30

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bandit
        run: python -m pip install bandit[toml]

      - name: Run bandit
        run: bandit -r lumena/ -f json -o bandit-report.json -ll || true

      - name: Bandit summary
        run: bandit -r lumena/ -ll

      - name: Upload bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: lumena/bandit-report.json
          retention-days: 30

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain]"

      - name: Check licenses
        run: |
          python -m pip install pip-licenses
          pip-licenses --format=json --output-file=licenses.json || true
          pip-licenses --summary || true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: lumena/licenses.json
          retention-days: 30
