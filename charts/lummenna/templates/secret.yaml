{{- if and .Values.auth.createSecret.enabled (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.createSecret.value }}
{{- fail "auth.createSecret.enabled requires auth.createSecret.value (or use auth.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lummenna.fullname" . }}-auth
  labels:
    {{- include "lummenna.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.auth.createSecret.value | quote }}
{{- end }}
