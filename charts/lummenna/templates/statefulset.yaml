{{- if gt (int .Values.replicaCount) 1 }}
{{- fail "Lummenna is single-writer SQLite: replicaCount must be 1. Each extra replica would hold an independent, divergent memory palace. See values.yaml header." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lummenna.fullname" . }}
  labels:
    {{- include "lummenna.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lummenna.fullname" . }}
  replicas: 1
  # Recreate semantics: never run two writers against the same store PVC.
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "lummenna.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lummenna.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.model.url }}
      initContainers:
        - name: provision-model
          image: {{ .Values.model.initImage }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              MODEL_DIR="/models/{{ .Values.model.name }}"
              if [ -f "$MODEL_DIR/model.onnx" ]; then
                echo "model already provisioned at $MODEL_DIR"
                exit 0
              fi
              {{- if not .Values.model.sha256 }}
              echo "ERROR: model.url is set but model.sha256 is empty — refusing an unverified model artifact" >&2
              exit 1
              {{- end }}
              echo "downloading {{ .Values.model.url }}"
              curl -fsSL -o /tmp/model.tar.gz "{{ .Values.model.url }}"
              echo "{{ .Values.model.sha256 }}  /tmp/model.tar.gz" | sha256sum -c -
              mkdir -p "$MODEL_DIR"
              tar -xzf /tmp/model.tar.gz -C "$MODEL_DIR"
              test -f "$MODEL_DIR/model.onnx" || { echo "ERROR: archive did not contain model.onnx at root" >&2; exit 1; }
              echo "model provisioned"
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      containers:
        - name: lummenna
          image: {{ include "lummenna.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8848
          env:
            - name: LUMMENNA_API_HOST
              value: "0.0.0.0"
            - name: LUMMENNA_API_PORT
              value: "8848"
            - name: LUMMENNA_STORE_PATH
              value: /data/store
            - name: LUMMENNA_MODEL_PATH
              value: /data/models
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.config.forwardedAllowIps | quote }}
            - name: LUMMENNA_EMBEDDING_MODEL
              value: {{ .Values.model.name | quote }}
            - name: LUMMENNA_DEVICE
              value: {{ .Values.config.device | quote }}
            - name: LUMMENNA_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: LUMMENNA_API_RATE_LIMIT
              value: {{ .Values.config.rateLimit | quote }}
            - name: LUMMENNA_ALLOWED_ORIGINS
              value: {{ .Values.config.allowedOrigins | quote }}
            - name: LUMMENNA_CONTEXT_BUDGET
              value: {{ .Values.config.contextBudget | quote }}
            - name: LUMMENNA_MEMORY_LIMIT_MB
              value: {{ .Values.config.memoryLimitMb | quote }}
            - name: LUMMENNA_SOVEREIGN
              value: {{ .Values.config.sovereign | quote }}
            {{- if or .Values.auth.existingSecret .Values.auth.createSecret.enabled }}
            - name: LUMMENNA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lummenna.apiKeySecretName" . }}
                  key: api-key
            {{- end }}
            {{- if .Values.azureMonitor.enabled }}
            {{- if eq .Values.config.sovereign "true" }}
            {{- fail "azureMonitor.enabled requires config.sovereign=\"false\": Lummenna refuses telemetry export in sovereign mode" }}
            {{- end }}
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ required "azureMonitor.existingSecret is required when azureMonitor.enabled" .Values.azureMonitor.existingSecret }}
                  key: connection-string
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: store
              mountPath: /data/store
            - name: models
              mountPath: /data/models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.store.storageClassName }}
        storageClassName: {{ .Values.persistence.store.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.store.size }}
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.models.storageClassName }}
        storageClassName: {{ .Values.persistence.models.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.models.size }}
