version: "3.8"

services:
  lumena:
    build: .
    image: lumena:latest
    container_name: lumena-api
    restart: unless-stopped
    ports:
      - "${LUMENA_API_PORT:-8848}:8848"
    volumes:
      - lumena_data:/root/.lumena
    environment:
      - LUMENA_API_HOST=0.0.0.0
      - LUMENA_API_PORT=8848
      - LUMENA_LOG_LEVEL=${LUMENA_LOG_LEVEL:-info}
      - LUMENA_API_KEY=${LUMENA_API_KEY:-}
      - LUMENA_API_RATE_LIMIT=${LUMENA_API_RATE_LIMIT:-60/minute}
      - LUMENA_ALLOWED_ORIGINS=${LUMENA_ALLOWED_ORIGINS:-*}
      - LUMENA_DEVICE=${LUMENA_DEVICE:-generic}
      - LUMENA_CONTEXT_BUDGET=${LUMENA_CONTEXT_BUDGET:-2048}
      - LUMENA_MEMORY_LIMIT_MB=${LUMENA_MEMORY_LIMIT_MB:-512}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8848/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lumena_data:
    driver: local