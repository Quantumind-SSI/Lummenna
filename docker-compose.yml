services:
  lummenna:
    build: .
    image: lummenna:latest
    container_name: lummenna-api
    restart: unless-stopped
    ports:
      - "${LUMMENNA_API_PORT:-8848}:8848"
    volumes:
      - lummenna_store:/data/store
      - lummenna_models:/data/models
    environment:
      - LUMMENNA_API_HOST=0.0.0.0
      - LUMMENNA_API_PORT=8848
      - LUMMENNA_STORE_PATH=/data/store
      - LUMMENNA_MODEL_PATH=/data/models
      - LUMMENNA_LOG_LEVEL=${LUMMENNA_LOG_LEVEL:-info}
      - LUMMENNA_API_KEY=${LUMMENNA_API_KEY:-}
      - LUMMENNA_API_RATE_LIMIT=${LUMMENNA_API_RATE_LIMIT:-60/minute}
      - LUMMENNA_ALLOWED_ORIGINS=${LUMMENNA_ALLOWED_ORIGINS:-http://localhost:8848}
      - LUMMENNA_DEVICE=${LUMMENNA_DEVICE:-generic}
      - LUMMENNA_CONTEXT_BUDGET=${LUMMENNA_CONTEXT_BUDGET:-2048}
      - LUMMENNA_MEMORY_LIMIT_MB=${LUMMENNA_MEMORY_LIMIT_MB:-512}
    healthcheck:
      # Liveness. Readiness (/ready) is model-aware and intentionally 503s
      # until an embedding model is provisioned into the models volume.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8848/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  lummenna_store:
    driver: local
  lummenna_models:
    driver: local
