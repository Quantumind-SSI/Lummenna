[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lummenna"
version = "1.0.0"
description = "Twin-force memory and context framework for sovereign AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "QuantumindSSI", email = "admin@quantumindssi.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { Repository = "https://github.com/QuantmindSSI/lummenna" }
dependencies = [
    # Force A: Mnemonic
    "sqlite-vec>=0.1.0",
    "usearch>=2.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "numba>=0.59",
    "apscheduler>=3.10",
    # Force B: Contextual
    "scikit-learn>=1.4",
    "jinja2>=3.1",
    "structlog>=24.1",
    # Lummenna: Unification
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.0",
    "msgspec>=0.18",
    "psutil>=5.9",
    "zeroconf>=0.132",
    # NLP / embeddings — RUNTIME inference only.
    # onnxruntime runs the exported ONNX model; transformers provides the
    # tokenizer (AutoTokenizer). transformers WITHOUT its optional [torch] extra
    # is torch-free, so the runtime install stays lean. The heavy export
    # toolchain (optimum -> torch/CUDA, ~2GB) lives in the [export] extra;
    # spaCy (onboarding wizard only) lives in [wizard]; llama-cpp in [localllm].
    "onnxruntime>=1.17",
    "transformers>=4.36",
    # API server (pilot requirement)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
    # Model download
    "huggingface-hub>=0.20",
    "cryptography>=42.0",
    # Encryption-at-rest (SQLCipher)
    "sqlcipher3>=0.6 ; platform_machine == 'x86_64' or platform_machine == 'aarch64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3.0",
    "pre-commit>=3.6",
    "httpx>=0.27",
]
langchain = [
    "langchain>=0.3",
]
langgraph = [
    "langgraph>=0.2",
]
mcp = [
    "mcp>=1.0,<3.0",
]
# Heavy ONNX EXPORT toolchain (optimum pulls torch/CUDA, ~2GB). Only needed to
# run `lummenna model download/export`. Consumers who use a prebuilt ONNX model
# bundle never need this — keeping the base install lean (<300MB target).
export = [
    "optimum[onnxruntime]>=1.17",
]
# spaCy-powered onboarding wizard (`lummenna illuminate`). Optional; the wizard
# degrades gracefully when spaCy is absent.
wizard = [
    "spacy>=3.7",
]
# On-device LLM for narrative consolidation (off by default; large native dep).
localllm = [
    "llama-cpp-python>=0.2.0 ; platform_machine == 'aarch64' or platform_machine == 'x86_64'",
]
# Convenience: the full local-first stack (export toolchain + wizard + local LLM
# + MCP). Equivalent to the previous fat default install.
full = [
    "lummenna[mcp,export,wizard,localllm]",
]
azure = [
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
benchmarks = [
    "datasets>=2.0",
    "sentence-transformers>=2.0",
    "scipy>=1.10",
    "pytrec-eval>=0.5",
    "ir-measures>=0.3",
    "rank-bm25>=0.2.2",
]

[project.scripts]
lummenna = "lummenna.cli.main:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "allow_network: test needs a socket connection off the local machine; exempts it from the default-deny egress guard in tests/conftest.py",
]

[tool.coverage.paths]
source = ["lummenna"]

[tool.coverage.report]
fail_under = 50
show_missing = true
